name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  id-token: write

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2

  build:
    needs: static-checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: inventory
            context: services/inventory
          - service: booking-bff
            context: services/booking-bff
          - service: seatmap
            context: services/seatmap
          - service: payment-worker
            context: services/payment-worker
          - service: settlement
            context: services/settlement
          - service: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.CI_ROLE_ARN }}
          aws-region: ap-south-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build
        run: |
          IMG=${{ steps.ecr.outputs.registry }}/seat-booking/${{ matrix.service }}:${{ github.sha }}
          docker build -t "$IMG" ${{ matrix.context }}
          echo "IMG=$IMG" >> "$GITHUB_ENV"

      - name: Trivy scan (blocks on CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMG }}
          exit-code: "1"
          severity: CRITICAL
          ignore-unfixed: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMG }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.json

      - name: Publish SBOM as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.json

      - name: Push
        run: docker push "$IMG"

      - uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless, OIDC)
        run: cosign sign --yes "$IMG"

      - name: Promote - bump image tag in Helm values
        run: |
          sed -i "s|tag: .*|tag: \"${{ github.sha }}\"|" platform/charts/values/values-${{ matrix.service }}.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add platform/charts/values/values-${{ matrix.service }}.yaml
          git diff --cached --quiet && exit 0
          git commit -m "ci: bump ${{ matrix.service }} to ${{ github.sha }}"
          for i in 1 2 3 4 5; do
            git push && break
            git fetch origin main
            git rebase origin/main
            sleep $((RANDOM % 5 + 1))
          done
