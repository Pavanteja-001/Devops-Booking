{{- if not .Values.cronjob.enabled }}
{{- if .Values.canary.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
{{- else }}
apiVersion: apps/v1
kind: Deployment
{{- end }}
metadata:
  name: {{ include "seat-service.name" . }}
  labels: {{ include "seat-service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{ include "seat-service.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{ include "seat-service.labels" . | nindent 8 }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "seat-service.name" . }}
      {{- end }}
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
      containers:
        - name: {{ include "seat-service.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.port }}
          securityContext:
            runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
            runAsUser: {{ .Values.securityContext.runAsUser }}
            allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
            readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
          env:
            - name: DEPLOYMENT_TRACK
              value: {{ .Values.track | quote }}
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if .Values.envFromSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.envFromSecret }}
          {{- end }}
          {{- if .Values.probes.liveness }}
          livenessProbe:
            httpGet: { path: {{ .Values.probes.liveness }}, port: {{ .Values.port }} }
            periodSeconds: 10
          {{- end }}
          {{- if .Values.probes.readiness }}
          readinessProbe:
            httpGet: { path: {{ .Values.probes.readiness }}, port: {{ .Values.port }} }
            periodSeconds: 10
          {{- end }}
          resources:
            requests: {{ .Values.resources.requests | toYaml | nindent 14 }}
            limits: {{ .Values.resources.limits | toYaml | nindent 14 }}
  {{- if .Values.canary.enabled }}
  strategy:
    canary:
      canaryService: {{ include "seat-service.name" . }}-canary
      stableService: {{ include "seat-service.name" . }}-stable
      trafficRouting:
        nginx:
          stableIngress: {{ include "seat-service.name" . }}
      analysis:
        templates:
          - templateName: {{ include "seat-service.name" . }}-error-rate
        startingStep: 1
      steps: {{ .Values.canary.steps | toYaml | nindent 8 }}
  {{- end }}
{{- end }}
