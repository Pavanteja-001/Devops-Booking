{{- if .Values.cronjob.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "seat-service.name" . }}
  labels: {{ include "seat-service.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.cronjob.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels: {{ include "seat-service.labels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
            runAsUser: {{ .Values.securityContext.runAsUser }}
          containers:
            - name: {{ include "seat-service.name" . }}
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
                runAsUser: {{ .Values.securityContext.runAsUser }}
                allowPrivilegeEscalation: {{ .Values.securityContext.allowPrivilegeEscalation }}
                readOnlyRootFilesystem: {{ .Values.securityContext.readOnlyRootFilesystem }}
              env:
                {{- range $key, $value := .Values.env }}
                - name: {{ $key }}
                  value: {{ $value | quote }}
                {{- end }}
              resources:
                requests: {{ .Values.resources.requests | toYaml | nindent 18 }}
                limits: {{ .Values.resources.limits | toYaml | nindent 18 }}
{{- end }}
