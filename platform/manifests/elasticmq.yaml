apiVersion: v1
kind: ConfigMap
metadata:
  name: elasticmq-conf
  namespace: booking
data:
  elasticmq.conf: |
    include classpath("application.conf")

    node-address {
      protocol = http
      host = "*"
      port = 9324
    }

    rest-sqs {
      enabled = true
      bind-port = 9324
      bind-hostname = "0.0.0.0"
    }

    queues {
      payments {
        defaultVisibilityTimeout = 30 seconds
        delay = 0 seconds
        receiveMessageWait = 10 seconds
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticmq
  namespace: booking
spec:
  replicas: 1
  selector: { matchLabels: { app: elasticmq } }
  template:
    metadata: { labels: { app: elasticmq } }
    spec:
      containers:
        - name: elasticmq
          image: softwaremill/elasticmq-native:1.5.7
          ports: [{ containerPort: 9324 }]
          volumeMounts:
            - { name: conf, mountPath: /opt/elasticmq.conf, subPath: elasticmq.conf }
      volumes:
        - name: conf
          configMap: { name: elasticmq-conf }
---
apiVersion: v1
kind: Service
metadata:
  name: elasticmq
  namespace: booking
spec:
  selector: { app: elasticmq }
  ports: [{ port: 9324, targetPort: 9324 }]
